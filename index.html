<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Đánh Giá Nguy Cơ Ngập Lụt</title>

    <!-- Thư viện Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Header tiêu đề */
        .map-title {
            position: absolute;
            top: 10px;
            left: 55px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 16px;
            font-weight: bold;
            color: #1a365d;
        }

        /* Bảng chú giải Legend */
        .legend {
            background: white;
            padding: 10px;
            line-height: 1.5;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            font-size: 12px;
        }

        .legend h4 {
            margin: 0 0 5px;
            color: #333;
            font-size: 13px;
        }

        .legend i {
            width: 16px;
            height: 16px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="map-title">HỆ THỐNG WEBGIS ĐÁNH GIÁ NGUY CƠ NGẬP LỤT</div>
    <div id="map"></div>

    <!-- Thư viện Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Khởi tạo bản đồ (Tọa độ trung tâm Quy Nhơn [13.78, 109.22], mức Zoom 12)
        var map = L.map('map').setView([13.78, 109.22], 12);

        // 2. Định nghĩa các lớp bản đồ nền (Basemaps)
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        });

        var esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri'
        }).addTo(map); // Mặc định bật vệ tinh

        var baseMaps = {
            "Ảnh Vệ Tinh (Esri)": esriSatellite,
            "Bản Đồ Đường Phố (OSM)": osm
        };

        // 3. Hàm quy định màu sắc cho 5 cấp nguy cơ (1: Thấp nhất -> 5: Rất cao)
        function getColor(value) {
            return value == 5 ? '#d73027' : // Rất cao - Đỏ
                   value == 4 ? '#fc8d59' : // Cao - Cam
                   value == 3 ? '#fee08b' : // Trung bình - Vàng
                   value == 2 ? '#d9ef8b' : // Thấp - Xanh nhạt
                   value == 1 ? '#91cf60' : // Rất thấp - Xanh lá
                                '#cccccc';  // Mặc định
        }

        // Nhãn phân cấp nguy cơ
        function getRiskLabel(value) {
            return value == 5 ? 'Rất cao (5)' :
                   value == 4 ? 'Cao (4)' :
                   value == 3 ? 'Trung bình (3)' :
                   value == 2 ? 'Thấp (2)' :
                   value == 1 ? 'Rất thấp (1)' : 'Không xác định';
        }

        // 4. Hàm Style cho các lớp Polygon
        function stylePolygon(feature) {
            // Lấy giá trị cấp độ từ gridcode hoặc DN hoặc Value
            var val = feature.properties.gridcode || feature.properties.DN || feature.properties.Value || feature.properties.value || 1;
            return {
                fillColor: getColor(val),
                weight: 0.8,
                opacity: 1,
                color: '#ffffff',
                fillOpacity: 0.65
            };
        }

        // 5. Hàm tương tác Pop-up khi click vào từng vùng
        function onEachFeature(layerName) {
            return function(feature, layer) {
                var val = feature.properties.gridcode || feature.properties.DN || feature.properties.Value || feature.properties.value || 'N/A';
                layer.bindPopup(
                    "<b>Lớp: </b>" + layerName + "<br>" +
                    "<b>Mức độ nguy cơ: </b>" + getRiskLabel(val) + "<br>" +
                    "<b>Giá trị phân cấp: </b>" + val
                );
            };
        }

        // 6. Danh sách các lớp dữ liệu chuyên đề (Overlay Maps)
        var overlayMaps = {};
        var layerControl = L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

        // Hàm tải file GeoJSON và đưa vào bảng điều khiển Layer Control
        function loadGeoJSON(filePath, layerName, isDefaultOn) {
            fetch(filePath)
                .then(response => {
                    if (!response.ok) throw new Error("Không thể tải " + filePath);
                    return response.json();
                })
                .then(data => {
                    var geoLayer = L.geoJSON(data, {
                        style: stylePolygon,
                        onEachFeature: onEachFeature(layerName)
                    });

                    // Thêm vào danh sách quản lý lớp
                    layerControl.addOverlay(geoLayer, layerName);

                    // Nếu là lớp kết quả FRI thì bật sẵn mặc định và zoom theo dữ liệu
                    if (isDefaultOn) {
                        geoLayer.addTo(map);
                        map.fitBounds(geoLayer.getBounds());
                    }
                })
                .catch(err => console.error("Lỗi tải lớp:", layerName, err));
        }

        // 7. Tải toàn bộ 8 lớp tiêu chí và 1 lớp kết quả FRI
        loadGeoJSON('data/fri.geojson', '<b>⭐ Nguy cơ ngập (FRI Tổng hợp)</b>', true);
        loadGeoJSON('data/dem.geojson', 'Cao trình (DEM)', false);
        loadGeoJSON('data/slope.geojson', 'Độ dốc (Slope)', false);
        loadGeoJSON('data/twi.geojson', 'Chỉ số ẩm ướt (TWI)', false);
        loadGeoJSON('data/spi.geojson', 'Sức mạnh dòng chảy (SPI)', false);
        loadGeoJSON('data/rainfall.geojson', 'Lượng mưa (Rainfall)', false);
        loadGeoJSON('data/river.geojson', 'Khoảng cách sông (River)', false);
        loadGeoJSON('data/road.geojson', 'Khoảng cách đường (Road)', false);
        loadGeoJSON('data/landuse.geojson', 'Sử dụng đất (Landuse)', false);

        // 8. Tạo Bảng chú giải (Legend)
        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            var grades = [5, 4, 3, 2, 1];
            var labels = ['Rất cao', 'Cao', 'Trung bình', 'Thấp', 'Rất thấp'];

            div.innerHTML += '<h4>Cấp độ nguy cơ</h4>';
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + getColor(grades[i]) + '"></i> ' +
                    labels[i] + ' (' + grades[i] + ')<br>';
            }
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
